# ─────────────────────────────────────────────────────────────────────────────
# workspaces.conf — Named workspaces with per-monitor binding
# Monitor assignments set here match the layout in monitors.conf:
#   DP-2 = AOC 1440p 180Hz (primary/esports)
#   DP-4 = Dell 1080p (secondary)
#   DP-1 = Hisense TV 4K (media/left)
# On single-monitor machines (Deck, other PCs) all workspaces go to the one display.
# ─────────────────────────────────────────────────────────────────────────────

# ── Primary monitor (AOC DP-2) — dev workspaces ───────────────────────────────
workspace = 1, name:editor-1,  monitor:DP-2, default:true, on-created-empty:kitty
workspace = 2, name:editor-2,  monitor:DP-2
workspace = 3, name:browser,   monitor:DP-2, on-created-empty:flatpak run io.github.zen_browser.zen
workspace = 4, name:messaging, monitor:DP-2, on-created-empty:vesktop

# ── Secondary monitor (Dell DP-4) — overflow + steam ──────────────────────────
workspace = 5, name:editor-3,  monitor:DP-4, default:true
workspace = 6, name:free-1,    monitor:DP-4
workspace = 7, name:free-2,    monitor:DP-4
workspace = 8, name:steam-dev, monitor:DP-4, on-created-empty:steam

# ── Hisense TV (DP-1) — media workspaces ──────────────────────────────────────
workspace = 9,  name:media, monitor:DP-1, default:true
workspace = 10, name:free-3, monitor:DP-1

# ── Scratchpad ────────────────────────────────────────────────────────────────
workspace = special:scratch, gapsin:16, gapsout:32, on-created-empty:kitty
