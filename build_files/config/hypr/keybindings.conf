# ─────────────────────────────────────────────────────────────────────────────
# keybindings.conf — Omarchy-style bindings
# Variables ($mod, $terminal, etc.) are defined in hyprland.conf
# ─────────────────────────────────────────────────────────────────────────────

# ── Application launchers ─────────────────────────────────────────────────────
bind = $mod,       Return, exec, $terminal
bind = $mod,       Space,  exec, $launcher
bind = $mod,       E,      exec, $filemanager
bind = $mod CTRL,  L,      exec, $locker
bind = $mod CTRL,  Q,      exec, $powermenu
bind = $mod,       slash,  exec, kitty --class hypr-help -- bash -c "hypr-help | less -R"

# ── Wallpaper picker ──────────────────────────────────────────────────────────
bind = $mod CTRL, Space, exec, hypr-wallpaper

# ── Screenshot ────────────────────────────────────────────────────────────────
# Area → pipe into swappy for annotation/save
bind = , Print,           exec, grim -g "$(slurp)" - | swappy -f -
# Full screen → swappy
bind = $mod, Print,       exec, grim - | swappy -f -
# Area → clipboard only
bind = $mod SHIFT, Print, exec, grim -g "$(slurp)" - | wl-copy

# ── Clipboard history ─────────────────────────────────────────────────────────
bind = $mod CTRL, V, exec, cliphist list | wofi --dmenu | cliphist decode | wl-copy

# ─────────────────────────────────────────────────────────────────────────────
# Window management
# ─────────────────────────────────────────────────────────────────────────────
bind = $mod, Q, killactive
bind = $mod, F, fullscreen, 0           # true fullscreen
bind = $mod, M, fullscreen, 1           # maximize (keep bar)
bind = $mod, T, togglefloating
bind = $mod, V, togglesplit             # swap split direction
bind = $mod, P, pseudo                  # pseudotile (maintain window size)
bind = $mod, O, pin                     # pin floating window to all workspaces

# ── Window grouping (tab-like stacking) ───────────────────────────────────────
bind = $mod,       G,            togglegroup
bind = $mod,       bracketright, changegroupactive, f
bind = $mod,       bracketleft,  changegroupactive, b
bind = $mod SHIFT, G,            moveoutofgroup

# ── Scratchpad ────────────────────────────────────────────────────────────────
bind = $mod,     S, togglespecialworkspace, scratch
bind = $mod ALT, S, movetoworkspace,        special:scratch

# ─────────────────────────────────────────────────────────────────────────────
# Focus movement — arrows + vim hjkl
# ─────────────────────────────────────────────────────────────────────────────
bind = $mod, Left,  movefocus, l
bind = $mod, Right, movefocus, r
bind = $mod, Up,    movefocus, u
bind = $mod, Down,  movefocus, d
bind = $mod, H,     movefocus, l
bind = $mod, J,     movefocus, d
bind = $mod, K,     movefocus, u
bind = $mod, L,     movefocus, r

# ── Swap windows ──────────────────────────────────────────────────────────────
bind = $mod SHIFT, Left,  swapwindow, l
bind = $mod SHIFT, Right, swapwindow, r
bind = $mod SHIFT, Up,    swapwindow, u
bind = $mod SHIFT, Down,  swapwindow, d
bind = $mod SHIFT, H,     swapwindow, l
bind = $mod SHIFT, J,     swapwindow, d
bind = $mod SHIFT, K,     swapwindow, u
bind = $mod SHIFT, L,     swapwindow, r

# ── Resize windows (repeatable) ───────────────────────────────────────────────
binde = $mod ALT, Right, resizeactive,  40 0
binde = $mod ALT, Left,  resizeactive, -40 0
binde = $mod ALT, Up,    resizeactive,  0 -40
binde = $mod ALT, Down,  resizeactive,  0  40

# ─────────────────────────────────────────────────────────────────────────────
# Workspaces 1–10
# ─────────────────────────────────────────────────────────────────────────────
bind = $mod,       1, workspace, 1
bind = $mod,       2, workspace, 2
bind = $mod,       3, workspace, 3
bind = $mod,       4, workspace, 4
bind = $mod,       5, workspace, 5
bind = $mod,       6, workspace, 6
bind = $mod,       7, workspace, 7
bind = $mod,       8, workspace, 8
bind = $mod,       9, workspace, 9
bind = $mod,       0, workspace, 10

# Move window — follow focus
bind = $mod SHIFT, 1, movetoworkspace, 1
bind = $mod SHIFT, 2, movetoworkspace, 2
bind = $mod SHIFT, 3, movetoworkspace, 3
bind = $mod SHIFT, 4, movetoworkspace, 4
bind = $mod SHIFT, 5, movetoworkspace, 5
bind = $mod SHIFT, 6, movetoworkspace, 6
bind = $mod SHIFT, 7, movetoworkspace, 7
bind = $mod SHIFT, 8, movetoworkspace, 8
bind = $mod SHIFT, 9, movetoworkspace, 9
bind = $mod SHIFT, 0, movetoworkspace, 10

# Move window — stay on current workspace
bind = $mod ALT SHIFT, 1, movetoworkspacesilent, 1
bind = $mod ALT SHIFT, 2, movetoworkspacesilent, 2
bind = $mod ALT SHIFT, 3, movetoworkspacesilent, 3
bind = $mod ALT SHIFT, 4, movetoworkspacesilent, 4
bind = $mod ALT SHIFT, 5, movetoworkspacesilent, 5
bind = $mod ALT SHIFT, 6, movetoworkspacesilent, 6
bind = $mod ALT SHIFT, 7, movetoworkspacesilent, 7
bind = $mod ALT SHIFT, 8, movetoworkspacesilent, 8
bind = $mod ALT SHIFT, 9, movetoworkspacesilent, 9
bind = $mod ALT SHIFT, 0, movetoworkspacesilent, 10

# Cycle workspaces
bind = $mod,       Tab,       workspace, e+1
bind = $mod SHIFT, Tab,       workspace, e-1
bind = $mod,       mouse_down, workspace, e+1
bind = $mod,       mouse_up,   workspace, e-1

# ─────────────────────────────────────────────────────────────────────────────
# Multi-monitor
# ─────────────────────────────────────────────────────────────────────────────
bind = $mod CTRL,       Left,  focusmonitor, -1
bind = $mod CTRL,       Right, focusmonitor, +1
bind = $mod CTRL SHIFT, Left,  movewindow, mon:-1
bind = $mod CTRL SHIFT, Right, movewindow, mon:+1

# ─────────────────────────────────────────────────────────────────────────────
# Mouse binds
# ─────────────────────────────────────────────────────────────────────────────
bindm = $mod, mouse:272, movewindow
bindm = $mod, mouse:273, resizewindow

# ─────────────────────────────────────────────────────────────────────────────
# Alt+Tab — cycle open windows
# ─────────────────────────────────────────────────────────────────────────────
bind = ALT,       Tab, cyclenext
bind = ALT SHIFT, Tab, cyclenext, prev

# ─────────────────────────────────────────────────────────────────────────────
# Media & hardware keys  (bindl = active even on lock screen)
# ─────────────────────────────────────────────────────────────────────────────
bindel = , XF86AudioRaiseVolume,  exec, pamixer -i 5 && dunstify -h int:value:$(pamixer --get-volume) -h string:x-dunst-stack-tag:volume "󰕾 Volume" "$(pamixer --get-volume)%"
bindel = , XF86AudioLowerVolume,  exec, pamixer -d 5 && dunstify -h int:value:$(pamixer --get-volume) -h string:x-dunst-stack-tag:volume "󰕾 Volume" "$(pamixer --get-volume)%"
bindl  = , XF86AudioMute,         exec, pamixer -t && dunstify -h string:x-dunst-stack-tag:volume "󰝟 Volume" "$([ $(pamixer --get-mute) = true ] && echo Muted || echo Unmuted)"
bindl  = , XF86AudioPlay,         exec, playerctl play-pause
bindl  = , XF86AudioPause,        exec, playerctl play-pause
bindl  = , XF86AudioNext,         exec, playerctl next
bindl  = , XF86AudioPrev,         exec, playerctl previous
bindl  = , XF86AudioStop,         exec, playerctl stop
bindel = , XF86MonBrightnessUp,   exec, brightnessctl s +5%
bindel = , XF86MonBrightnessDown, exec, brightnessctl s 5%-

# ── Dual Steam sessions ───────────────────────────────────────────────────────
bind = $mod, F8, exec, kitty -- dualscope

# ── Dev terminal (enters dev distrobox) ───────────────────────────────────────
bind = $mod SHIFT, Return, exec, kitty -- distrobox enter dev

# ── Primary monitor cycle + audio switch ─────────────────────────────────────
bind = $mod,       F1, exec, hypr-primary-switch
bind = $mod SHIFT, F1, exec, hypr-primary-switch --pick

# ── Virtual keyboard toggle ────────────────────────────────────────────────────
bind = $mod, K, exec, pkill wvkbd-mobintl || wvkbd-mobintl

# ── Settings panel ────────────────────────────────────────────────────────────
bind = $mod CTRL, comma, exec, hyprzzite-settings

# ── Quick alarm ───────────────────────────────────────────────────────────────
bind = $mod, F12, exec, zenity --entry --title="Set Alarm" --text="Time (HH:MM):" | xargs -I{} hyprzzite-alarm {}

# ── App summon (focus-or-launch) ──────────────────────────────────────────────
bind = $mod, B, exec, hyprctl dispatch focuswindow class:zen-browser || flatpak run io.github.zen_browser.zen
bind = $mod, D, exec, hyprctl dispatch focuswindow class:vesktop || vesktop
bind = $mod, A, exec, hyprctl dispatch focuswindow title:Open.WebUI || xdg-open http://localhost:3000
bind = $mod, N, exec, hyprctl dispatch focuswindow class:obsidian || flatpak run md.obsidian.Obsidian

# ── Named workspace jump ──────────────────────────────────────────────────────
bind = $mod CTRL, 1, workspace, name:editor-1
bind = $mod CTRL, 2, workspace, name:editor-2
bind = $mod CTRL, 3, workspace, name:browser
bind = $mod CTRL, 4, workspace, name:messaging
bind = $mod CTRL, 5, workspace, name:editor-3
bind = $mod CTRL, 6, workspace, name:free-1
bind = $mod CTRL, 7, workspace, name:free-2
bind = $mod CTRL, 8, workspace, name:steam-dev
bind = $mod CTRL, 9, workspace, name:media

# ── Move workspace between monitors ──────────────────────────────────────────
bind = $mod CTRL SHIFT, Right, movecurrentworkspacetomonitor, +1
bind = $mod CTRL SHIFT, Left,  movecurrentworkspacetomonitor, -1
