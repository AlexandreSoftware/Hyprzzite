# hyprland-deck.conf — Steam Deck display and input overrides
# Sourced by autostart.conf when eDP-1 is detected

monitor = eDP-1, 1280x800@60, 0x0, 1.25

input {
    touchdevice {
        enabled = true
    }

    # Slightly higher sensitivity for small trackpads
    sensitivity = 0.2
}

gestures {
    workspace_swipe = true
    workspace_swipe_fingers = 4
    workspace_swipe_distance = 200
    workspace_swipe_invert = true
    workspace_swipe_min_speed_to_force = 15
    workspace_swipe_cancel_ratio = 0.3
}

# Smaller gaps on 1280px screen
general {
    gaps_in = 3
    gaps_out = 6
}

# Larger font / UI scale compensation
env = GDK_SCALE, 1.25
env = QT_SCALE_FACTOR, 1.25
