# ─────────────────────────────────────────────────────────────────────────────
# monitors.conf — This PC desktop layout (3-monitor)
# Generated/confirmed by hyprzzite-setup — edit via hyprzzite-settings
# Format: monitor = NAME, RESxRES@HZ, XxY, SCALE
# Positions are in logical (scaled) pixels.
# ─────────────────────────────────────────────────────────────────────────────

# DP-1  Hisense ~55" 4K 144Hz — left (TV/media/couch)
# Scale 1.5 → effective 2560×1440 logical, prevents tiny UI at desk distance
monitor = DP-1, 3840x2160@144, 0x0, 1.5

# DP-2  AOC Q27G4 27" 1440p 180Hz — centre primary (main/esports)
# Starts at logical x=2560 (3840 ÷ 1.5)
monitor = DP-2, 2560x1440@180, 2560x0, 1.0

# DP-4  Dell P2422HE 24" 1080p — right (Discord / secondary)
# Starts at logical x=2560+2560=5120
monitor = DP-4, 1920x1080@60, 5120x0, 1.0

# Catch-all: any display not listed (other machines, Steam Deck) → auto
monitor = , preferred, auto, 1
