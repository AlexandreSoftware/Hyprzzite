# ─────────────────────────────────────────────────────────────────────────────
# Hyprzzite · hyprland.conf
# Opinionated Omarchy-style Hyprland config for Bazzite
# ─────────────────────────────────────────────────────────────────────────────

# ── Variables ─────────────────────────────────────────────────────────────────
$mod         = SUPER
$terminal    = kitty
$launcher    = wofi --show drun
$filemanager = thunar
$locker      = hyprlock
$powermenu   = wlogout
$screenshot  = grim -g "$(slurp)" - | swappy -f -

# ── Monitors ──────────────────────────────────────────────────────────────────
# Auto-configure every detected display at preferred resolution & refresh rate.
# Add specific entries ABOVE the catch-all for per-display overrides, e.g.:
#   monitor = DP-1, 2560x1440@144, 0x0, 1
#   monitor = HDMI-A-1, preferred, auto, 1
monitor = , preferred, auto, 1

# ── Autostart ─────────────────────────────────────────────────────────────────
source = ~/.config/hypr/autostart.conf

# ─────────────────────────────────────────────────────────────────────────────
# Core compositor settings
# ─────────────────────────────────────────────────────────────────────────────

general {
    gaps_in           = 4
    gaps_out          = 8
    border_size       = 2
    col.active_border   = rgba(3daee9ff) rgba(8e44adff) 45deg
    col.inactive_border = rgba(24272caa)
    layout            = dwindle
    resize_on_border  = true
    allow_tearing     = false
}

decoration {
    rounding           = 8
    active_opacity     = 1.0
    inactive_opacity   = 0.95
    fullscreen_opacity = 1.0

    blur {
        enabled           = true
        size              = 6
        passes            = 2
        new_optimizations = true
        xray              = false
        ignore_opacity    = false
    }

    shadow {
        enabled        = true
        range          = 12
        render_power   = 3
        color          = rgba(00000066)
        color_inactive = rgba(00000033)
    }
}

animations {
    enabled = true

    bezier = easeOutQuint,   0.23, 1,    0.32, 1
    bezier = almostLinear,   0.5,  0.5,  0.75, 1.0
    bezier = quick,          0.15, 0,    0.1,  1

    animation = global,        1, 10, default
    animation = border,        1,  5, easeOutQuint
    animation = windows,       1,  4, easeOutQuint
    animation = windowsIn,     1,  4, easeOutQuint, popin 87%
    animation = windowsOut,    1,  2, quick,        popin 87%
    animation = fadeIn,        1,  2, almostLinear
    animation = fadeOut,       1,  2, almostLinear
    animation = fade,          1,  3, quick
    animation = layers,        1,  4, easeOutQuint
    animation = layersIn,      1,  4, easeOutQuint, fade
    animation = layersOut,     1,  2, quick,        fade
    animation = fadeLayersIn,  1,  2, almostLinear
    animation = fadeLayersOut, 1,  2, almostLinear
    animation = workspaces,    1,  2, almostLinear, fade
    animation = workspacesIn,  1,  2, almostLinear, fade
    animation = workspacesOut, 1,  2, almostLinear, fade
}

input {
    kb_layout    = us
    kb_options   = compose:caps
    follow_mouse = 1
    sensitivity  = 0
    accel_profile = flat

    touchpad {
        natural_scroll       = true
        disable_while_typing = true
        scroll_factor        = 0.8
        tap-to-click         = true
    }
}

misc {
    force_default_wallpaper  = 0
    disable_hyprland_logo    = true
    disable_splash_rendering = true
    mouse_move_enables_dpms  = true
    key_press_enables_dpms   = true
    animate_manual_resizes   = true
    enable_swallow           = true
    swallow_regex            = ^(kitty)$
}

# ── Layout engines ────────────────────────────────────────────────────────────
dwindle {
    pseudotile     = false
    preserve_split = true
    smart_split    = false
    smart_resizing = true
}

master {
    new_status = slave
    new_on_top = false
}

# ── Gestures ──────────────────────────────────────────────────────────────────
gestures {
    workspace_swipe                  = true
    workspace_swipe_fingers          = 3
    workspace_swipe_distance         = 300
    workspace_swipe_invert           = true
    workspace_swipe_min_speed_to_force = 30
    workspace_swipe_cancel_ratio     = 0.5
    workspace_swipe_create_new       = true
}

# ── XWayland ──────────────────────────────────────────────────────────────────
xwayland {
    force_zero_scaling = true
}

# ─────────────────────────────────────────────────────────────────────────────
# Window rules
# ─────────────────────────────────────────────────────────────────────────────
windowrule = suppressevent maximize, class:.*

# ── Volume mixer ───────────────────────────────────────────────────────────────
windowrule = float,        class:^(pavucontrol)$
windowrule = size 700 450, class:^(pavucontrol)$
windowrule = center,       class:^(pavucontrol)$

# ── Bluetooth manager ──────────────────────────────────────────────────────────
windowrule = float,        class:^(blueman-manager)$
windowrule = size 600 400, class:^(blueman-manager)$
windowrule = center,       class:^(blueman-manager)$

# ── Network editor ─────────────────────────────────────────────────────────────
windowrule = float,        class:^(nm-connection-editor)$
windowrule = size 600 400, class:^(nm-connection-editor)$
windowrule = center,       class:^(nm-connection-editor)$

# ── File operation / save dialogs ─────────────────────────────────────────────
windowrule = float,  title:^(File Operation Progress)$
windowrule = center, title:^(File Operation Progress)$
windowrule = float,  title:^(Confirm to replace files)$
windowrule = center, title:^(Confirm to replace files)$
windowrule = float,  title:^(Open File)$
windowrule = float,  title:^(Save File)$
windowrule = float,  title:^(Select a File)$
windowrule = center, title:^(Open File)$
windowrule = center, title:^(Save File)$
windowrule = center, title:^(Select a File)$

# ── Picture-in-Picture (pins to corner, follows across workspaces) ─────────────
windowrule = float,           title:^(Picture.in.Picture)$
windowrule = pin,             title:^(Picture.in.Picture)$
windowrule = keepaspectratio, title:^(Picture.in.Picture)$
windowrule = size 640 360,    title:^(Picture.in.Picture)$
windowrule = move 100%-660 60, title:^(Picture.in.Picture)$

# ── Floating utility windows (Omarchy "floating-window" pattern) ──────────────
windowrule = float,        class:^(org.gnome.Calculator)$
windowrule = size 400 500, class:^(org.gnome.Calculator)$
windowrule = center,       class:^(org.gnome.Calculator)$
windowrule = float,        class:^(org.gnome.Calendar)$
windowrule = float,        class:^(nwg-look)$
windowrule = center,       class:^(nwg-look)$
windowrule = float,        class:^(zenity)$
windowrule = center,       class:^(zenity)$
windowrule = float,        class:^(file-roller)$
windowrule = center,       class:^(file-roller)$
windowrule = float,        class:^(org.kde.ark)$
windowrule = center,       class:^(org.kde.ark)$

# ── Steam ──────────────────────────────────────────────────────────────────────
windowrule   = float,        title:^(Steam)$
windowrule   = size 1100 700, title:^(Steam)$
windowrule   = center,       title:^(Steam)$
windowrulev2 = float,        class:^(steam)$,title:^(Friends List)$
windowrulev2 = size 300 500, class:^(steam)$,title:^(Friends List)$

# ── Idle inhibit while any app is fullscreen (prevents lock/sleep mid-game) ───
windowrule = idleinhibit fullscreen, class:.*

# ── Discord on workspace 3 ─────────────────────────────────────────────────────
windowrule = workspace 3 silent, class:^(discord)$

# ── Dual Steam / Gamescope ─────────────────────────────────────────────────────
windowrule = fullscreenstate 3, class:^(gamescope)$
windowrule = monitor DP-3,      class:^(gamescope)$

# ── Scratchpad special workspace styling ──────────────────────────────────────
workspace = special:scratch, gapsin:16, gapsout:32, on-created-empty:$terminal

# ── Help overlay ──────────────────────────────────────────────────────────────
windowrule = float,        class:^(hypr-help)$
windowrule = size 860 640, class:^(hypr-help)$
windowrule = center,       class:^(hypr-help)$
windowrule = stayfocused,  class:^(hypr-help)$
windowrule = pin,          class:^(hypr-help)$

# ─────────────────────────────────────────────────────────────────────────────
# Keybindings (sourced last so all variables above are resolved)
# ─────────────────────────────────────────────────────────────────────────────
source = ~/.config/hypr/keybindings.conf
