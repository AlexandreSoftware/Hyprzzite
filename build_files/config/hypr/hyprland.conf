################
### MONITORS ###
################

# Vertical monitor (left) — 1080p rotated 90° clockwise
monitor = DP-4, 1920x1080@60, 0x226, 1, transform, 1

# Main gaming monitor (right) — 2560x1440 @ 180Hz
monitor = DP-2, 2560x1440@180, 1080x0, 1

# TV — disabled
monitor = DP-3, disable


###################
### ENV VARS    ###
###################

env = XCURSOR_SIZE, 24
env = XCURSOR_THEME, Adwaita
env = GDK_BACKEND, wayland,x11,*
env = QT_QPA_PLATFORM, wayland;xcb
env = QT_WAYLAND_DISABLE_WINDOWDECORATION, 1
env = MOZ_ENABLE_WAYLAND, 1
env = SDL_VIDEODRIVER, wayland
env = CLUTTER_BACKEND, wayland


################
### AUTOSTART ##
################

exec-once = hyprpaper
exec-once = hypridle
exec-once = dunst
exec-once = waybar
exec-once = /usr/libexec/polkit-gnome-authentication-agent-1
exec-once = wl-paste --type text --watch cliphist store
exec-once = wl-paste --type image --watch cliphist store


#####################
### LOOK AND FEEL ###
#####################

# Colors derived from Breeze Dark (your KDE theme)
# Accent: #3daee9 (KDE Breeze Blue)  Background: #24272c  Inactive: #7f8c8d

general {
    gaps_in = 4
    gaps_out = 8
    border_size = 2
    col.active_border = rgba(3daee9ff) rgba(346c92ff) 45deg
    col.inactive_border = rgba(24272cff)
    resize_on_border = true
    allow_tearing = false
    layout = dwindle
}

decoration {
    rounding = 6
    active_opacity = 1.0
    inactive_opacity = 0.96

    shadow {
        enabled = true
        range = 8
        render_power = 3
        color = rgba(0a0f14ee)
    }

    blur {
        enabled = true
        size = 6
        passes = 3
        vibrancy = 0.12
    }
}

animations {
    enabled = true

    bezier = easeOutQuint, 0.23, 1, 0.32, 1
    bezier = easeInOutSine, 0.37, 0, 0.63, 1

    animation = windows, 1, 4, easeOutQuint, slide
    animation = windowsOut, 1, 3, easeInOutSine, slide
    animation = border, 1, 10, default
    animation = fade, 1, 6, default
    animation = workspaces, 1, 4, easeOutQuint, slide
}

dwindle {
    # Mirrors your KDE 25/50/25 tiling layout
    pseudotile = true
    preserve_split = true
    split_width_multiplier = 1.5
}

master {
    new_status = master
}

misc {
    force_default_wallpaper = 0
    disable_hyprland_logo = true
    vfr = true
}


#################
### INPUT     ###
#################

input {
    kb_layout = us
    follow_mouse = 1
    sensitivity = 0
    accel_profile = flat

    touchpad {
        natural_scroll = true
        drag_lock = true
    }
}

gestures {
    workspace_swipe = true
    workspace_swipe_fingers = 3
}


###################
### KEYBINDINGS ###
###################

$mod = SUPER
$terminal = kitty
$fileManager = thunar
$launcher = wofi --show drun

# Basics
bind = $mod, Return, exec, $terminal
bind = $mod, E, exec, $fileManager
bind = $mod, Space, exec, $launcher
bind = $mod, Q, killactive
bind = $mod SHIFT, E, exit
bind = $mod, F, fullscreen
bind = $mod SHIFT, Space, togglefloating
bind = $mod, P, pseudo       # dwindle pseudotile
bind = $mod, J, togglesplit  # dwindle split direction

# Screenshots (grim + slurp + swappy)
bind = , Print, exec, mkdir -p ~/Pictures/Screenshots && grim ~/Pictures/Screenshots/$(date +%Y-%m-%d_%H-%M-%S).png
bind = SHIFT, Print, exec, grim -g "$(slurp)" - | swappy -f -

# Clipboard history
bind = $mod, V, exec, cliphist list | wofi --dmenu | cliphist decode | wl-copy

# Move focus (arrow keys + vim hjkl)
bind = $mod, left,  movefocus, l
bind = $mod, right, movefocus, r
bind = $mod, up,    movefocus, u
bind = $mod, down,  movefocus, d
bind = $mod, H, movefocus, l
bind = $mod, L, movefocus, r
bind = $mod, K, movefocus, u
bind = $mod, N, movefocus, d

# Move windows
bind = $mod SHIFT, left,  movewindow, l
bind = $mod SHIFT, right, movewindow, r
bind = $mod SHIFT, up,    movewindow, u
bind = $mod SHIFT, down,  movewindow, d

# Resize windows
binde = $mod CTRL, right, resizeactive,  30 0
binde = $mod CTRL, left,  resizeactive, -30 0
binde = $mod CTRL, up,    resizeactive, 0 -30
binde = $mod CTRL, down,  resizeactive,  0 30

# Workspaces — assign to main monitor by default
bind = $mod, 1, workspace, 1
bind = $mod, 2, workspace, 2
bind = $mod, 3, workspace, 3
bind = $mod, 4, workspace, 4
bind = $mod, 5, workspace, 5
bind = $mod, 6, workspace, 6
bind = $mod, 7, workspace, 7
bind = $mod, 8, workspace, 8
bind = $mod, 9, workspace, 9
bind = $mod, 0, workspace, 10

bind = $mod SHIFT, 1, movetoworkspace, 1
bind = $mod SHIFT, 2, movetoworkspace, 2
bind = $mod SHIFT, 3, movetoworkspace, 3
bind = $mod SHIFT, 4, movetoworkspace, 4
bind = $mod SHIFT, 5, movetoworkspace, 5
bind = $mod SHIFT, 6, movetoworkspace, 6
bind = $mod SHIFT, 7, movetoworkspace, 7
bind = $mod SHIFT, 8, movetoworkspace, 8
bind = $mod SHIFT, 9, movetoworkspace, 9
bind = $mod SHIFT, 0, movetoworkspace, 10

# Move workspace to a specific monitor
bind = $mod CTRL, right, movecurrentworkspacetomonitor, r
bind = $mod CTRL, left,  movecurrentworkspacetomonitor, l

# Scroll through workspaces
bind = $mod, mouse_down, workspace, e+1
bind = $mod, mouse_up,   workspace, e-1

# Move/resize windows with mouse
bindm = $mod, mouse:272, movewindow
bindm = $mod, mouse:273, resizewindow

# Media / volume keys
bindel = , XF86AudioRaiseVolume, exec, pamixer -i 5
bindel = , XF86AudioLowerVolume, exec, pamixer -d 5
bindl  = , XF86AudioMute,        exec, pamixer -t
bindl  = , XF86AudioPlay,        exec, playerctl play-pause
bindl  = , XF86AudioNext,        exec, playerctl next
bindl  = , XF86AudioPrev,        exec, playerctl previous

# Brightness keys
bindel = , XF86MonBrightnessUp,   exec, brightnessctl s +5%
bindel = , XF86MonBrightnessDown, exec, brightnessctl s 5%-

# Lock screen
bind = $mod, Delete, exec, hyprlock


#####################
### WORKSPACE RULES ##
#####################

# Pin workspaces 1-5 to main monitor (DP-2), 6-8 to vertical (DP-4)
workspace = 1,  monitor:DP-2, default:true
workspace = 2,  monitor:DP-2
workspace = 3,  monitor:DP-2
workspace = 4,  monitor:DP-2
workspace = 5,  monitor:DP-2
workspace = 6,  monitor:DP-4, default:true
workspace = 7,  monitor:DP-4
workspace = 8,  monitor:DP-4


#####################
### WINDOW RULES  ###
#####################

windowrule = suppressevent maximize, class:.*

# Float common dialogs
windowrule = float, class:^(pavucontrol)$
windowrule = float, class:^(blueman-manager)$
windowrule = float, class:^(nm-connection-editor)$
windowrule = float, title:^(File Operation Progress)$
windowrule = float, title:^(Confirm to replace files)$

# Discord on workspace 3 (main monitor)
windowrule = workspace 3, class:^(discord)$
