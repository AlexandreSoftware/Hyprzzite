# ─────────────────────────────────────────────────────────────────────────────
# autostart.conf — exec-once programs
# ─────────────────────────────────────────────────────────────────────────────

# ── Wayland environment for D-Bus / systemd ───────────────────────────────────
exec-once = dbus-update-activation-environment --systemd WAYLAND_DISPLAY XDG_CURRENT_DESKTOP=Hyprland
exec-once = systemctl --user import-environment WAYLAND_DISPLAY XDG_CURRENT_DESKTOP

# ── Polkit authentication agent ───────────────────────────────────────────────
exec-once = /usr/lib/polkit-gnome/polkit-gnome-authentication-agent-1

# ── Wallpaper ─────────────────────────────────────────────────────────────────
exec-once = hyprpaper

# ── Status bar ────────────────────────────────────────────────────────────────
exec-once = waybar

# ── Notifications ─────────────────────────────────────────────────────────────
exec-once = dunst

# ── Idle management ───────────────────────────────────────────────────────────
exec-once = hypridle

# ── Clipboard: watch both text and images ─────────────────────────────────────
exec-once = wl-paste --type text  --watch cliphist store
exec-once = wl-paste --type image --watch cliphist store

# ── System tray applets ───────────────────────────────────────────────────────
exec-once = nm-applet --indicator
exec-once = blueman-applet

# ── Cursor theme ──────────────────────────────────────────────────────────────
exec-once = hyprctl setcursor Breeze 24

# ── XDG user dirs ─────────────────────────────────────────────────────────────
exec-once = xdg-user-dirs-update

# ── Communication apps (silent, tray only) ────────────────────────────────────
exec-once = vesktop --start-minimized
exec-once = flatpak run dev.ferdium.Ferdium --hidden

# ── Media players (silent, controllable via playerctl / waybar) ───────────────
exec-once = flatpak run com.spotify.Client --minimized
exec-once = flatpak run com.plexamp.Plexamp --minimized

# ── Discord Rich Presence ─────────────────────────────────────────────────────
exec-once = arrpc

# ── Deck: source deck-specific config if running on eDP-1 ────────────────────
exec-once = bash -c 'hyprctl monitors | grep -q eDP-1 && hyprctl keyword source ~/.config/hypr/hyprland-deck.conf'
