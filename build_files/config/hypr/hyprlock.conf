general {
    disable_loading_bar = false
    hide_cursor         = true
    grace               = 0
    no_fade_in          = false
}

background {
    monitor     =
    blur_passes = 3
    blur_size   = 8
    color       = rgba(1b2027ff)
}

# ── Clock ─────────────────────────────────────────────────────────────────────
label {
    monitor     =
    text        = cmd[update:1000] echo "$(date +"%H:%M")"
    color       = rgba(eff0f1ff)
    font_size   = 80
    font_family = JetBrainsMono Nerd Font Bold
    position    = 0, 200
    halign      = center
    valign      = center
}

# ── Date ──────────────────────────────────────────────────────────────────────
label {
    monitor     =
    text        = cmd[update:60000] echo "$(date +"%A, %B %d")"
    color       = rgba(7f8c8dff)
    font_size   = 20
    font_family = JetBrainsMono Nerd Font
    position    = 0, 110
    halign      = center
    valign      = center
}

# ── Password input ────────────────────────────────────────────────────────────
input-field {
    monitor          =
    size             = 320, 55
    outline_thickness = 2
    dots_size        = 0.26
    dots_spacing     = 0.64
    outer_color      = rgba(3daee9ff)
    inner_color      = rgba(24272cff)
    font_color       = rgba(eff0f1ff)
    check_color      = rgba(3daee9ff)
    fail_color       = rgba(da4453ff)
    fade_on_empty    = true
    placeholder_text = <i>Password...</i>
    hide_input       = false
    rounding         = 8
    position         = 0, -80
    halign           = center
    valign           = center
}
