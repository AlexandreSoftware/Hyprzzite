general {
    disable_loading_bar = false
    hide_cursor = true
}

background {
    monitor =
    blur_passes = 3
    blur_size = 8
    color = rgba(11111bff)
}

input-field {
    monitor =
    size = 300, 55
    outline_thickness = 3
    dots_size = 0.26
    dots_spacing = 0.64
    outer_color = rgba(cba6f7ff)
    inner_color = rgba(1e1e2eff)
    font_color = rgba(cdd6f4ff)
    fade_on_empty = true
    placeholder_text = <i>Password...</i>
    hide_input = false
    rounding = 10
    position = 0, -80
    halign = center
    valign = center
}

label {
    monitor =
    text = cmd[update:1000] echo "$(date +"%H:%M")"
    color = rgba(cdd6f4ff)
    font_size = 80
    font_family = Noto Sans Bold
    position = 0, 200
    halign = center
    valign = center
}

label {
    monitor =
    text = cmd[update:60000] echo "$(date +"%A, %B %d")"
    color = rgba(a6adc8ff)
    font_size = 20
    font_family = Noto Sans
    position = 0, 110
    halign = center
    valign = center
}
