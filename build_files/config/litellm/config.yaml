model_list:
  - model_name: local/llama3
    litellm_params:
      model: ollama/llama3
      api_base: http://localhost:11434

  - model_name: claude-sonnet
    litellm_params:
      model: anthropic/claude-sonnet-4-6
      api_key: os.environ/ANTHROPIC_API_KEY

  # Uncomment and fill in after bootstrap USB runs:
  # - model_name: homelab/default
  #   litellm_params:
  #     model: openai/default
  #     api_base: http://HOMELAB_URL:11434

litellm_settings:
  drop_params: true

general_settings:
  master_key: "hyprzzite-local"
